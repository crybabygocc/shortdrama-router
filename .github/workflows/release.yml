name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:standalone
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          platform="$(node -p 'process.platform + "-" + process.arch')"
          tar -C packages/sdk/dist/standalone -czf "shortdrama-router-${platform}.tar.gz" shortdrama-router manifest.json
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $platform = node -p 'process.platform + "-" + process.arch'
          Compress-Archive -Path packages/sdk/dist/standalone/shortdrama-router.exe,packages/sdk/dist/standalone/manifest.json -DestinationPath "shortdrama-router-$platform.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}
          path: shortdrama-router-*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          merge-multiple: true
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
