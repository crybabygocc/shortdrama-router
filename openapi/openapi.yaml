openapi: 3.1.0
info:
  title: shortdrama-router API
  version: 0.1.0
  description: >-
    OpenAI/OpenRouter-style audio, image and video routing for short-drama creation
    platforms. Models and authorization are discovered per provider.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: '{scheme}://{host}'
    description: Self-hosted shortdrama-router server
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:8080
tags:
  - name: Health
    description: Local server health.
  - name: Providers
    description: Provider discovery, models and authorization.
  - name: Audio
    description: Asynchronous general audio generation.
  - name: Images
    description: Synchronous and asynchronous image generation.
  - name: Videos
    description: Asynchronous video generation.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Check server health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: List installed providers and authorization state
      parameters:
        - $ref: '#/components/parameters/Probe'
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderDescriptor'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/providers/{provider_id}:
    get:
      tags: [Providers]
      operationId: getProvider
      summary: Get one installed provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Probe'
      responses:
        '200':
          description: Provider descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDescriptor'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/providers/{provider_id}/models:
    get:
      tags: [Providers]
      operationId: listProviderModels
      summary: List models for one provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider-scoped model list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderModel'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/providers/{provider_id}/authorization:
    get:
      tags: [Providers]
      operationId: getProviderAuthorization
      summary: Get provider authorization state
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Probe'
      responses:
        '200':
          description: Authorization state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAuthorizationStatus'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags: [Providers]
      operationId: beginProviderAuthorization
      summary: Begin local interactive authorization
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method]
              properties:
                method:
                  enum: [api_key, oauth, browser_session]
      responses:
        '201':
          description: Authorization request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAuthorizationRequest'
        '409':
          $ref: '#/components/responses/Error'
    put:
      tags: [Providers]
      operationId: completeProviderAuthorization
      summary: Complete local interactive authorization
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderAuthorizationCompletion'
      responses:
        '200':
          description: Updated authorization state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAuthorizationStatus'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Providers]
      operationId: clearProviderAuthorization
      summary: Clear local provider authorization
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '204':
          description: Authorization cleared
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/audio:
    post:
      tags: [Audio]
      operationId: createAudioJob
      summary: Create an asynchronous general audio job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioCreateRequest'
      responses:
        '202':
          description: Audio job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/audio/{audio_id}:
    get:
      tags: [Audio]
      operationId: getAudioJob
      summary: Get an asynchronous audio job
      parameters:
        - $ref: '#/components/parameters/AudioId'
      responses:
        '200':
          description: Audio job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioJob'
        '404':
          $ref: '#/components/responses/Error'
  /v1/images/generations:
    post:
      tags: [Images]
      operationId: generateOpenAIImage
      summary: Generate images using the OpenAI Images response shape
      description: Waits for the provider job and returns generated image URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIImageCreateRequest'
      responses:
        '200':
          description: Generated images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIImagesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /api/v1/images:
    post:
      tags: [Images]
      operationId: createImageJob
      summary: Create an asynchronous image job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateRequest'
      responses:
        '202':
          description: Image job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/images/{image_id}:
    get:
      tags: [Images]
      operationId: getImageJob
      summary: Get an asynchronous image job
      parameters:
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Image job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageJob'
        '404':
          $ref: '#/components/responses/Error'
  /v1/videos:
    post:
      tags: [Videos]
      operationId: createOpenAIVideo
      summary: Create a video job using an OpenAI-style path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpenAIVideoCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCreateRequest'
      responses:
        '202':
          description: Video job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /v1/videos/{video_id}:
    get:
      tags: [Videos]
      operationId: getOpenAIVideo
      summary: Get a video job using an OpenAI-style path
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/videos:
    post:
      tags: [Videos]
      operationId: createVideoJob
      summary: Create an asynchronous multi-provider video job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCreateRequest'
      responses:
        '202':
          description: Video job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{video_id}:
    get:
      tags: [Videos]
      operationId: getVideoJob
      summary: Get an asynchronous video job
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: shortdrama-router key
  parameters:
    Probe:
      name: probe
      in: query
      description: Verify configured provider credentials when supported.
      schema:
        type: boolean
        default: false
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    AudioId:
      name: audio_id
      in: path
      required: true
      schema:
        type: string
    ImageId:
      name: image_id
      in: path
      required: true
      schema:
        type: string
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ProviderAuthorizationStatus:
      type: object
      required: [authorized, configured, method, state]
      properties:
        authorized:
          type: [boolean, 'null']
        configured:
          type: boolean
        method:
          type: [string, 'null']
          enum: [api_key, oauth, browser_session, null]
        state:
          enum: [not_configured, configured, valid, expiring, expired, error]
        expires_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        reason:
          type: string
    ProviderDescriptor:
      type: object
      required: [authorization, capabilities, description, id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        authorization:
          $ref: '#/components/schemas/ProviderAuthorizationStatus'
        capabilities:
          type: object
          required: [authorization, generation, models, usage]
          properties:
            authorization:
              type: array
              items:
                enum: [api_key, oauth, browser_session]
            generation:
              type: array
              items:
                enum: [audio, image, video]
            models:
              const: true
            usage:
              type: boolean
    ProviderModel:
      type: object
      required: [capabilities, description, id, kind, name, provider]
      properties:
        id:
          type: string
        provider:
          type: string
        kind:
          enum: [audio, image, video]
        name:
          type: string
        description:
          type: string
        capabilities:
          type: object
          additionalProperties: true
    ProviderAuthorizationRequest:
      type: object
      required: [authorization_id, expires_at, login_url, method]
      properties:
        authorization_id:
          type: string
        expires_at:
          type: string
          format: date-time
        login_url:
          type: string
          format: uri
        method:
          enum: [api_key, oauth, browser_session]
        cookie_origin:
          type: string
          format: uri
        cookie_names:
          type: array
          items:
            type: string
    ProviderAuthorizationCompletion:
      type: object
      additionalProperties: false
      required: [authorization_id, method]
      properties:
        authorization_id:
          type: string
        method:
          enum: [api_key, oauth, browser_session]
        cookie_origin:
          type: string
          format: uri
        cookies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
                writeOnly: true
              expires_at:
                type: string
                format: date-time
    ProviderAssetReference:
      type: object
      additionalProperties: false
      required: [pippit_asset_id]
      properties:
        pippit_asset_id:
          type: string
        asset_id:
          type: string
    AudioCreateRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        model:
          type: string
          examples: [xiaoyunque/seed-audio-1.0]
        prompt:
          type: string
          minLength: 1
        format:
          type: string
          examples: [mp3]
        input_references:
          type: array
          items:
            $ref: '#/components/schemas/AudioInputReference'
        provider:
          type: string
        provider_options:
          type: object
          additionalProperties: true
    AudioInputReference:
      type: object
      additionalProperties: false
      required: [provider_asset, type]
      properties:
        type:
          enum: [audio, image]
        provider_asset:
          $ref: '#/components/schemas/ProviderAssetReference'
    AudioJob:
      $ref: '#/components/schemas/GenerationJob'
    ImageCreateRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
          examples: [xiaoyunque/seedream-4.5]
        prompt:
          type: string
          minLength: 1
        n:
          type: integer
          minimum: 1
          maximum: 10
        aspect_ratio:
          enum: [auto, '16:9', '21:9', '9:16', '4:3', '3:4', '1:1']
        resolution:
          enum: [1K, 2K, 4K]
        input_references:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/ProviderAssetReference'
        provider:
          type: string
        provider_options:
          type: object
          additionalProperties: true
    OpenAIImageCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ImageCreateRequest'
        - type: object
          properties:
            size:
              enum: [auto, 256x256, 512x512, 1024x1024, 1792x1024, 1024x1792]
            response_format:
              const: url
    OpenAIImagesResponse:
      type: object
      required: [created, data]
      properties:
        created:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
    ImageJob:
      $ref: '#/components/schemas/GenerationJob'
    OpenAIVideoCreateRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
          minLength: 1
        seconds:
          type: integer
          minimum: 1
        duration:
          type: integer
          minimum: 1
        aspect_ratio:
          type: string
        resolution:
          type: string
    VideoCreateRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        model:
          type: string
          examples: [xiaoyunque/seedance-2.0-mini-lite]
        prompt:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
          maximum: 60
        aspect_ratio:
          type: string
        resolution:
          type: string
        seed:
          type: integer
        provider:
          type: string
        provider_options:
          type: object
          additionalProperties: true
        frame_images:
          type: object
          properties:
            first_frame:
              $ref: '#/components/schemas/ProviderAssetReference'
            last_frame:
              $ref: '#/components/schemas/ProviderAssetReference'
        input_references:
          type: array
          items:
            type: object
            required: [provider_asset, type]
            properties:
              type:
                enum: [image, video, audio]
              provider_asset:
                $ref: '#/components/schemas/ProviderAssetReference'
    VideoJob:
      $ref: '#/components/schemas/GenerationJob'
    GenerationJob:
      type: object
      required: [created_at, id, model, provider, status, updated_at]
      properties:
        id:
          type: string
        model:
          type: string
        provider:
          type: string
        status:
          enum: [queued, in_progress, completed, failed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        outputs:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
              content_type:
                type: string
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
